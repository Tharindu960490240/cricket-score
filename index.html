<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1F3D2E" />
    <title>Cricket Scorer</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <div id="sheet"></div>
    <script>
      const LKEY = "cricket-admin-v3",
        OLDKEY = "cricket-tourney-v2",
        TKEY = "cricket-token-v1";
      const qs = new URLSearchParams(location.search);
      let T = null,
        H = [],
        mod = null,
        sheet = null,
        view = "setup",
        D = null,
        armed = null,
        mode = "public";
      let cloud = "checking",
        token = null,
        pushTimer = null,
        pushState = "idle",
        lastSync = 0,
        INDEX = null,
        tvTimer = null;
      const PUB = {
        tid: null,
        updated: -1,
        tab: "matches",
        mtab: "com",
        timer: null,
      };
      const $ = (s) => document.querySelector(s);
      const esc = (t) =>
        String(t ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const clamp = (v, a, b, d) => {
        v = parseInt(v);
        return isNaN(v) ? d : Math.max(a, Math.min(b, v));
      };
      const ov = (b) => Math.floor(b / 6) + "." + (b % 6);
      const tn = (i) => (T && T.teams[i] ? T.teams[i].name : "?");
      const M = () => T.matches[T.cur];
      const plOf = (m, team) => m.players[m.t.indexOf(team)];
      const maxW = (m, I) => (m.lastMan ? plOf(m, I.bat) : plOf(m, I.bat) - 1);
      const target = (m) => m.innings[0].runs + 1;
      const s1 = (n) => (n === 1 ? "" : "s");
      const hhmm = (t) =>
        new Date(t).toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
        });
      const lget = (k) => {
        try {
          return localStorage.getItem(k);
        } catch (e) {
          return null;
        }
      };
      const lset = (k, v) => {
        try {
          v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
        } catch (e) {}
      };
      function rid() {
        const a = "abcdefghjkmnpqrstuvwxyz23456789";
        const v = new Uint32Array(8);
        crypto.getRandomValues(v);
        return Array.from(v, (x) => a[x % a.length]).join("");
      }
      function arm(id) {
        if (armed === id) {
          armed = null;
          return true;
        }
        armed = id;
        setTimeout(() => {
          if (armed === id) {
            armed = null;
            render();
          }
        }, 3000);
        render();
        return false;
      }
      function snap() {
        H.push(JSON.stringify(M()));
      }
      function addSquad(team, name) {
        const t = T.teams[team];
        if (!t || !name) return;
        t.squad = t.squad || [];
        if (!t.squad.some((x) => x.toLowerCase() === name.toLowerCase()))
          t.squad.push(name);
      }
      function squadList(id, team) {
        return `<datalist id="${id}">${(T.teams[team].squad || []).map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>`;
      }
      function copyFrom(btn) {
        const inp = document.getElementById(btn.dataset.copy);
        const done = () => {
          btn.textContent = "Copied";
          setTimeout(() => (btn.textContent = "Copy"), 1500);
        };
        try {
          navigator.clipboard
            .writeText(inp.value)
            .then(done)
            .catch(() => {
              inp.focus();
              inp.select();
            });
        } catch (e) {
          inp.focus();
          inp.select();
        }
      }
      const origin = () => location.origin;

      /* ================= server ================= */
      async function api(path, opt = {}) {
        const r = await fetch("/api/" + path, { cache: "no-store", ...opt });
        let j = null;
        try {
          j = await r.json();
        } catch (e) {}
        return { status: r.status, ok: r.ok, j };
      }
      async function detect() {
        try {
          const ctl = new AbortController();
          const to = setTimeout(() => ctl.abort(), 5000);
          const r = await fetch("/api/state", {
            signal: ctl.signal,
            cache: "no-store",
          });
          clearTimeout(to);
          if (!(r.headers.get("content-type") || "").includes("json")) {
            cloud = "off";
            return;
          }
          if (r.status === 503) {
            cloud = "nostore";
            return;
          }
          if (r.ok) {
            cloud = "on";
            INDEX = await r.json();
          } else cloud = "off";
        } catch (e) {
          cloud = "off";
        }
      }
      function saveLocalOnly() {
        lset(LKEY, JSON.stringify({ T, H: H.slice(-150) }));
      }
      function save() {
        if (T) T.updated = Date.now();
        saveLocalOnly();
        schedulePush();
      }
      function schedulePush(delay = 500) {
        if (cloud !== "on" || !token || !T) return;
        clearTimeout(pushTimer);
        pushState = "pending";
        updSync();
        pushTimer = setTimeout(pushNow, delay);
      }
      async function pushNow() {
        try {
          const r = await fetch("/api/state", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify({ t: T.id, data: { T } }),
          });
          if (r.status === 401) {
            token = null;
            lset(TKEY, null);
            pushState = "auth";
          } else if (r.ok) {
            pushState = "ok";
            lastSync = Date.now();
          } else {
            pushState = "err";
            schedulePush(5000);
          }
        } catch (e) {
          pushState = "err";
          schedulePush(5000);
        }
        updSync();
      }
      function syncText() {
        if (cloud !== "on") return "Saved on this device";
        return {
          ok: "Live · updated " + hhmm(lastSync || Date.now()),
          pending: "Sending…",
          err: "No signal. Scores are saved on this phone and will send when you are back online.",
          auth: "Logged out. Log in again to publish scores.",
          idle: "Live",
        }[pushState];
      }
      function updSync() {
        document.querySelectorAll(".syncdot").forEach((el) => {
          el.textContent = syncText();
          el.classList.toggle(
            "bad",
            pushState === "err" || pushState === "auth",
          );
        });
      }
      async function flushPush() {
        if (pushState === "pending" || pushState === "err") {
          clearTimeout(pushTimer);
          await pushNow();
        }
      }

      /* ================= cricket helpers ================= */
      const HOW = [
        ["bowled", "Bowled"],
        ["caught", "Caught"],
        ["lbw", "LBW"],
        ["runout", "Run out"],
        ["stumped", "Stumped"],
        ["hitwicket", "Hit wicket"],
      ];
      const CREDIT = { bowled: 1, caught: 1, lbw: 1, stumped: 1, hitwicket: 1 };
      const NEEDS_F = {
        caught: "Caught by",
        stumped: "Stumped by (keeper)",
        runout: "Run out by (optional)",
      };
      function howText(b) {
        if (!b.out) return "not out";
        const w = b.bw || "",
          f = b.f || "";
        switch (b.how) {
          case "bowled":
            return "b " + w;
          case "caught":
            return f && f.toLowerCase() === w.toLowerCase()
              ? "c & b " + w
              : (f ? "c " + f + " " : "c ") + "b " + w;
          case "lbw":
            return "lbw b " + w;
          case "runout":
            return "run out" + (f ? " (" + f + ")" : "");
          case "stumped":
            return "st " + (f ? f + " " : "") + "b " + w;
          case "hitwicket":
            return "hit wicket b " + w;
          default:
            return "out";
        }
      }
      function ballText(x) {
        if (!x.bat) return esc(x.l);
        const who = `${esc(x.bow)} to ${esc(x.bat)}, `;
        const runs = (r) =>
          r === 4
            ? "<b>FOUR</b>"
            : r === 6
              ? "<b>SIX</b>"
              : r === 0
                ? "no run"
                : `${r} run${s1(r)}`;
        switch (x.k) {
          case "run":
            return who + runs(x.r);
          case "wd":
            return who + "wide" + (x.r ? `, ${x.r + 1} runs` : "");
          case "nb":
            return who + "no-ball" + (x.r ? ", " + runs(x.r) : "");
          case "b":
            return who + `${x.r} bye${s1(x.r)}`;
          case "lb":
            return who + `${x.r} leg bye${s1(x.r)}`;
          case "w":
            return (
              who +
              `<b>OUT!</b> ${esc(x.out)} ${esc(x.dis)} ${x.os}` +
              (x.r ? ` · ${x.r} run${s1(x.r)} completed` : "")
            );
        }
        return esc(x.l);
      }
      function collect(ms) {
        const bat = {},
          bowl = {};
        ms.forEach((m) =>
          m.innings.forEach((I) => {
            I.batters.forEach((b) => {
              const k = I.bat + "|" + b.name.toLowerCase();
              const o =
                bat[k] ||
                (bat[k] = {
                  name: b.name,
                  team: I.bat,
                  r: 0,
                  b: 0,
                  f4: 0,
                  s6: 0,
                  inn: 0,
                  hs: 0,
                });
              o.r += b.r;
              o.b += b.b;
              o.f4 += b.f4;
              o.s6 += b.s6;
              o.inn++;
              if (b.r > o.hs) o.hs = b.r;
            });
            I.bowlers.forEach((w) => {
              const k = I.bowl + "|" + w.name.toLowerCase();
              const o =
                bowl[k] ||
                (bowl[k] = {
                  name: w.name,
                  team: I.bowl,
                  balls: 0,
                  r: 0,
                  w: 0,
                  bw: -1,
                  br: 0,
                });
              o.balls += w.balls;
              o.r += w.r;
              o.w += w.w;
              if (w.w > o.bw || (w.w === o.bw && w.r < o.br)) {
                o.bw = w.w;
                o.br = w.r;
              }
            });
          }),
        );
        return {
          B: Object.values(bat)
            .filter((x) => x.b || x.r)
            .sort((a, b) => b.r - a.r || a.b - b.b),
          W: Object.values(bowl)
            .filter((x) => x.balls)
            .sort((a, b) => b.w - a.w || a.r - b.r || a.balls - b.balls),
        };
      }
      const batLine = (x, tour) =>
        tour
          ? `${x.r} runs · ${x.inn} inns · best ${x.hs}`
          : `${x.r} off ${x.b} ball${s1(x.b)}${x.s6 ? " · " + x.s6 + "×6" : ""}`;
      const bowlLine = (x, tour) =>
        tour
          ? `${x.w} wkt${s1(x.w)} · ${x.r} runs · ${ov(x.balls)} ov`
          : `${x.w}/${x.r} off ${ov(x.balls)} overs`;
      function awardsHTML(st, tour, champ) {
        const a = st.B[0],
          w = st.W[0];
        return `<div class="awards">
    ${champ != null ? `<div class="aw champ"><span class="label">Champions</span><b>${esc(tn(champ.i))}</b><span>${champ.pts} points · ${champ.w} win${s1(champ.w)}</span></div>` : ""}
    ${a ? `<div class="aw"><span class="label">${tour ? "Top run scorer" : "Top scorer"}</span><b>${esc(a.name)}</b><span>${esc(tn(a.team))} · ${batLine(a, tour)}</span></div>` : ""}
    ${w ? `<div class="aw"><span class="label">Best bowler</span><b>${esc(w.name)}</b><span>${esc(tn(w.team))} · ${bowlLine(w, tour)}</span></div>` : ""}
  </div>`;
      }
      function standings() {
        const rows = T.teams.map((t, i) => ({
          i,
          name: t.name,
          p: 0,
          w: 0,
          l: 0,
          tie: 0,
          pts: 0,
          rf: 0,
          bf: 0,
          ra: 0,
          bb: 0,
        }));
        T.matches.forEach((m) => {
          if (!m.result) return;
          m.innings.forEach((I) => {
            const balls = I.wkts >= maxW(m, I) ? m.overs * 6 : I.balls;
            rows[I.bat].rf += I.runs;
            rows[I.bat].bf += balls;
            rows[I.bowl].ra += I.runs;
            rows[I.bowl].bb += balls;
          });
          m.t.forEach((x) => {
            const r = rows[x];
            r.p++;
            if (m.winner === -1) {
              r.tie++;
              r.pts += 1;
            } else if (m.winner === x) {
              r.w++;
              r.pts += 2;
            } else r.l++;
          });
        });
        rows.forEach((r) => {
          r.nrr = r.bf && r.bb ? (r.rf * 6) / r.bf - (r.ra * 6) / r.bb : 0;
        });
        return rows.sort((a, b) => b.pts - a.pts || b.nrr - a.nrr || a.i - b.i);
      }
      const nrrTxt = (r) =>
        r.p ? (r.nrr >= 0 ? "+" : "") + r.nrr.toFixed(2) : "–";
      const sr = (r, b) => (b ? ((r * 100) / b).toFixed(0) : "–");
      const econ = (r, b) => (b ? ((r * 6) / b).toFixed(1) : "–");
      const chips = (o) =>
        o.balls
          .map((x) => `<span class="chip ${x.c}">${esc(x.l)}</span>`)
          .join("");
      function tableHTML() {
        const st = standings();
        return `<div class="tw"><table class="ptable"><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>NRR</th></tr>
  ${st.map((r, k) => `<tr class="${k === 0 && r.pts > 0 ? "lead" : ""}"><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.tie}</td><td><b>${r.pts}</b></td><td>${nrrTxt(r)}</td></tr>`).join("")}
  </table></div><p class="note">2 points for a win, 1 for a tie. Net run rate separates teams level on points.</p>`;
      }
      function leadersHTML(n) {
        const tour = collect(T.matches);
        if (!tour.B.length)
          return '<p class="note">Stats appear once the first ball is bowled.</p>';
        return `<div class="tw"><table class="ptable"><tr><th>Batter</th><th>Inns</th><th>Runs</th><th>Best</th><th>SR</th></tr>
  ${tour.B.slice(0, n)
    .map(
      (x) =>
        `<tr><td>${esc(x.name)}<span class="how">${esc(tn(x.team))}</span></td><td>${x.inn}</td><td><b>${x.r}</b></td><td>${x.hs}</td><td>${sr(x.r, x.b)}</td></tr>`,
    )
    .join("")}</table></div>
  ${
    tour.W.length
      ? `<div class="tw"><table class="ptable"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Best</th></tr>
  ${tour.W.slice(0, n)
    .map(
      (x) =>
        `<tr><td>${esc(x.name)}<span class="how">${esc(tn(x.team))}</span></td><td>${ov(x.balls)}</td><td>${x.r}</td><td><b>${x.w}</b></td><td>${x.bw}/${x.br}</td></tr>`,
    )
    .join("")}</table></div>`
      : ""
  }`;
      }
      function matchStatus(m) {
        if (m.result) return { t: m.result, live: false };
        const I = m.innings[m.cur];
        if (m.cur === 0 && !I.batters.length)
          return { t: `${tn(I.bat)} to bat first`, live: true };
        if (I.ended && m.cur === 0)
          return {
            t: `Innings break · ${tn(I.bowl)} need ${target(m)} to win`,
            live: true,
          };
        if (m.cur === 1) {
          const need = target(m) - I.runs,
            left = m.overs * 6 - I.balls;
          return {
            t: `${tn(I.bat)} need ${need} off ${left} ball${s1(left)}`,
            live: true,
          };
        }
        return {
          t: `${tn(I.bat)} batting · run rate ${I.balls ? ((I.runs * 6) / I.balls).toFixed(2) : "0.00"}`,
          live: true,
        };
      }
      function cardHTML(m, I, open) {
        const ex = I.extras,
          exT = ex.wd + ex.nb + ex.b + ex.lb;
        const dnb = (T.teams[I.bat].squad || []).length ? "" : "";
        return `<details class="card" ${open ? "open" : ""}><summary>${esc(tn(I.bat))} · ${I.runs}/${I.wkts} (${ov(I.balls)})</summary><div class="cardsec">
   <div class="tw"><table class="ptable"><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
   ${I.batters.map((b) => `<tr><td>${esc(b.name)}<span class="how">${esc(howText(b))}</span></td><td><b>${b.r}</b></td><td>${b.b}</td><td>${b.f4}</td><td>${b.s6}</td><td>${sr(b.r, b.b)}</td></tr>`).join("")}</table></div>
   <p class="note">Extras ${exT} (wd ${ex.wd}, nb ${ex.nb}, b ${ex.b}, lb ${ex.lb}) · Total ${I.runs}/${I.wkts} in ${ov(I.balls)} overs${dnb}</p>
   <div class="tw"><table class="ptable"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
   ${I.bowlers.map((b) => `<tr><td>${esc(b.name)}</td><td>${ov(b.balls)}</td><td>${b.r}</td><td><b>${b.w}</b></td><td>${econ(b.r, b.balls)}</td></tr>`).join("")}</table></div>
  </div></details>`;
      }
      function innSel(m) {
        return PUB.inn != null && m.innings[PUB.inn] ? PUB.inn : m.cur;
      }
      function innPicker(m) {
        const sel = innSel(m);
        return `<div class="seg" role="tablist" aria-label="Innings">${m.t
          .map((team) => {
            const i = m.innings.findIndex((I) => I.bat === team),
              I = m.innings[i];
            return `<button type="button" role="tab" data-inn="${i}" aria-pressed="${i === sel}" ${i < 0 ? "disabled" : ""}>${esc(tn(team))}<br><small>${I ? `${I.runs}/${I.wkts} (${ov(I.balls)})` : "Yet to bat"}</small></button>`;
          })
          .join("")}</div>`;
      }
      function bindInn(after) {
        document.querySelectorAll("[data-inn]").forEach(
          (b) =>
            (b.onclick = () => {
              PUB.inn = +b.dataset.inn;
              after();
            }),
        );
      }
      function commentaryHTML(m, i) {
        const I = m.innings[i];
        if (!I || !I.overs.length || !I.overs.some((o) => o.balls.length))
          return `<p class="note">${I ? esc(tn(I.bat)) + " innings has not started yet." : "Ball-by-ball commentary starts with the first ball."}</p>`;
        return `<div class="com">
    ${I.overs
      .map((o, oi) => ({ o, oi }))
      .reverse()
      .map(
        ({ o, oi }) => `
      ${o.end ? `<div class="ovend"><strong>End of over ${oi + 1}</strong><span>${o.end.runs} run${s1(o.end.runs)}</span><span>${esc(tn(I.bat))} ${o.end.score}</span>${o.end.bats.map((b) => `<span>${esc(b)}</span>`).join("")}<span>${esc(o.end.bowl)}</span></div>` : ""}
      ${[...o.balls]
        .reverse()
        .map(
          (x) =>
            `<div class="cb ${x.k === "w" ? "wk" : ""}"><span class="bn">${esc(x.n || oi + ".")}</span><span class="chip ${x.c}">${esc(x.l)}</span><span class="tx">${ballText(x)}</span></div>`,
        )
        .join("")}
    `,
      )
      .join("")}</div>`;
      }

      /* ================= tournament setup (admin) ================= */
      function openSetup(fresh) {
        const base = T && !fresh ? T : null;
        D = base
          ? {
              name: base.name,
              overs: base.overs,
              lastMan: base.lastMan,
              teams: base.teams.map((t) => ({ ...t })),
              edit: true,
            }
          : {
              name: T ? T.name + " 2" : "Weekend Cup",
              overs: T ? T.overs : 6,
              lastMan: T ? T.lastMan : false,
              teams: T
                ? T.teams.map((t) => ({
                    name: t.name,
                    players: t.players,
                    squad: [...(t.squad || [])],
                  }))
                : [
                    { name: "Tigers", players: 6, squad: [] },
                    { name: "Lions", players: 5, squad: [] },
                    { name: "Eagles", players: 6, squad: [] },
                  ],
              edit: false,
            };
        view = "setup";
        sheet = null;
        render();
      }
      function readSetup() {
        D.name = $("#sn").value.trim() || "Cricket Cup";
        D.overs = clamp($("#so").value, 1, 50, 6);
        D.teams.forEach((t, i) => {
          t.name = $("#tn" + i).value.trim() || "Team " + (i + 1);
          t.players = clamp($("#tp" + i).value, 2, 15, 6);
        });
      }
      function renderSetup() {
        $("#app").className = "wrap";
        const used = new Set();
        (D.edit ? T.matches : []).forEach((m) =>
          m.t.forEach((x) => used.add(x)),
        );
        $("#app").innerHTML = `
  <div class="topbar"><span class="label">${D.edit ? "Edit tournament" : "New tournament"}</span>${T ? '<button class="link" id="cancel">Cancel</button>' : ""}</div>
  <h1>${D.edit ? "Teams and rules" : "Set up a tournament"}</h1>
  <div class="panel">
    <label class="field"><span class="label">Tournament name</span><input id="sn" value="${esc(D.name)}"></label>
    <label class="field"><span class="label">Overs per innings (same for every match)</span><input id="so" type="number" inputmode="numeric" min="1" max="50" value="${D.overs}"></label>
    <div class="field"><span class="label">Last man stands</span>

      /* ================= match engine ================= */
      function newInn(bat, bowl) {

            I.non = -1;
          } else if (s && !n) {
            I.non = -1;
          }
          s = okB(I, I.striker);
          n = okB(I, I.non);
        }
        const at = (s ? 1 : 0) + (n ? 1 : 0);

          return;
        }
        const list = (INDEX && INDEX.index) || [];
        const live = T.matches
          .map((m, i) => ({ m, i }))
          .filter((x) => !x.m.result);
        const card = ({ m, i }) => {
          const s = matchStatus(m);
          return `<a class="fxi" href="#match-${i + 1}">
    <span class="row"><span class="label">Match ${i + 1}</span>${s.live ? '<span class="tag live">Live</span>' : ""}</span>
    <div class="sum">${m.t.map((t) => mrow(m, t, innOf(m, t))).join("")}</div>
    <span class="status ${s.live ? "live" : ""}">${esc(s.t)}</span></a>`;
        };
        const tab = PUB.tab;
        $("#app").innerHTML = `
  <div class="topbar"><span class="label">Live scores · ${T.overs} overs a side</span>
    ${list.length > 1 ? `<select id="tsel" aria-label="Tournament" style="width:auto">${list.map((x) => `<option value="${esc(x.id)}" ${x.id === PUB.tid ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>` : ""}</div>
  <h1>${esc(T.name)}</h1>
  ${T.finished ? `<div class="panel"><span class="label">Final</span>${awardsHTML(collect(T.matches), true, standings()[0])}</div>` : ""}
  ${live
    .map((x) => {
      const s = matchStatus(x.m);
      return `<a class="livecard" href="#match-${x.i + 1}">
    <span class="row"><span class="label" style="color:inherit;opacity:.75">Match ${x.i + 1} · ${x.m.overs} overs</span><span class="tag live">Live</span></span>
    ${x.m.t
      .map((t) => {
        const I = innOf(x.m, t);
        return `<span class="row"><span class="tm ${I ? "" : "dim"}">${esc(tn(t))}</span>${I && (I.balls || I.batters.length) ? `<span class="sc">${I.runs}/${I.wkts}<small>${ov(I.balls)}</small></span>` : '<span class="dim">Yet to bat</span>'}</span>`;
      })
      .join("")}
    <span class="st">${esc(s.t)}</span><span class="st" style="opacity:.7">Tap for ball by ball →</span></a>`;
    })
    .join("")}
  <div class="tabs" role="tablist">${[
    ["matches", "Matches"],
    ["table", "Points table"],
    ["stats", "Stats"],
  ]
    .map(
      ([k, l]) =>
        `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`,
    )
    .join("")}</div>
  ${
    tab === "matches"
      ? `<div class="fx">${
          T.matches.length
            ? T.matches
                .map((m, i) => ({ m, i }))
                .reverse()
                .map(card)
                .join("")
            : '<p class="note">No matches yet.</p>'
        }</div>`
      : ""
  }
  ${tab === "table" ? `<div class="panel">${tableHTML()}</div>` : ""}
  ${tab === "stats" ? `<div class="panel"><h2>Tournament leaders</h2>${leadersHTML(10)}</div>` : ""}
  <p class="note">Updates automatically.${cloud !== "on" ? ' <button class="link" id="toAdmin">Back to scoring</button>' : ""}</p>`;
        document.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              PUB.tab = b.dataset.tab;
              renderPublic();
            }),
        );
        $("#tsel") &&
          ($("#tsel").onchange = () => {
            PUB.tid = $("#tsel").value;
            PUB.pinned = true;
            PUB.updated = -1;
            try {
              history.replaceState(null, "", "?t=" + PUB.tid);
            } catch (e) {}
            pubTick();
          });
        $("#toAdmin") &&
          ($("#toAdmin").onclick = () => {
            location.hash = "admin";
          });
      }
      function renderCentre(i) {
        const m = T && T.matches[i];
        if (!m) {
          location.hash = "live";
          return;
        }
        $("#app").className = "wrap wide";
        const I = m.innings[m.cur],
          s = matchStatus(m);
        const inPlay = !m.result && !I.ended && I.batters.length;
        const bw = I.bowlers[I.bowler],
          cur = I.overs[I.overs.length - 1];
        const batRow = (k) => {
          const b = I.batters[k];
          return b
            ? `<tr><td class="${k === I.striker ? "strike" : ""}">${esc(b.name)}</td><td><b>${b.r}</b></td><td>${b.b}</td><td>${b.f4}</td><td>${b.s6}</td><td>${sr(b.r, b.b)}</td></tr>`
            : "";
        };
        const lastOut = [...I.batters].reverse().find((b) => b.out);
        const tab = PUB.mtab;
        $("#app").innerHTML = `
  <div class="topbar"><a class="link" href="#live">← ${esc(T.name)}</a>${s.live ? '<span class="tag live">Live</span>' : '<span class="tag">Result</span>'}</div>
  <h1>${esc(tn(m.t[0]))} v ${esc(tn(m.t[1]))}</h1>
  <div class="cols"><div class="col stick">
    <div class="panel"><span class="label">Match ${i + 1} · ${m.overs} overs · ${m.lastMan ? "last man can bat alone" : "last man off"}</span>
      <div class="sum">${m.innings.map((x) => mrow(m, x.bat, x)).join("")}${m.innings.length < 2 ? mrow(m, m.innings[0].bowl, null) : ""}</div>
      <span class="status ${s.live ? "live" : ""}">${esc(s.t)}</span>
      ${m.cur === 1 && !m.result ? `<p class="note">Run rate ${I.balls ? ((I.runs * 6) / I.balls).toFixed(2) : "0.00"} · Required ${m.overs * 6 - I.balls ? (((target(m) - I.runs) * 6) / (m.overs * 6 - I.balls)).toFixed(2) : "–"}</p>` : ""}
    </div>
    ${m.result ? `<div class="panel"><span class="label">Player awards</span>${awardsHTML(collect([m]), false)}</div>` : ""}
    ${
      inPlay
        ? `<div class="panel">
      ${I.non === -1 ? '<span><span class="tag alone">Last man batting alone</span></span>' : ""}
      <div class="tw"><table class="ptable"><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>${batRow(I.striker)}${batRow(I.non)}</table></div>
      ${bw ? `<div class="tw"><table class="ptable"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr><tr><td>${esc(bw.name)}</td><td>${ov(bw.balls)}</td><td>${bw.r}</td><td><b>${bw.w}</b></td><td>${econ(bw.r, bw.balls)}</td></tr></table></div>` : ""}
      <div><span class="label">This over</span><div class="over">${cur && cur.balls.length ? chips(cur) : '<span class="note">New over</span>'}</div></div>
      ${lastOut ? `<p class="note">Last wicket: ${esc(lastOut.name)} ${esc(howText(lastOut))} ${lastOut.r} (${lastOut.b})</p>` : ""}
    </div>`
        : ""
    }
  </div><div class="col">
    <div class="tabs" role="tablist">${[
      ["com", "Ball by ball"],
      ["card", "Scorecard"],
    ]
      .map(
        ([k, l]) =>
          `<button role="tab" data-mtab="${k}" aria-selected="${tab === k}">${l}</button>`,
      )
      .join("")}</div>
    ${innPicker(m)}
    ${tab === "com" ? commentaryHTML(m, innSel(m)) : cardHTML(m, m.innings[innSel(m)], true)}
  </div></div>`;
        document.querySelectorAll("[data-mtab]").forEach(
          (b) =>
            (b.onclick = () => {
              PUB.mtab = b.dataset.mtab;
              renderPublic();
            }),
        );
        bindInn(renderPublic);
      }
      function renderPublic() {
        document.body.className = "";
        $("#sheet").innerHTML = "";
        const h = location.hash.match(/^#match-(\d+)$/);
        if (h && T) renderCentre(+h[1] - 1);
        else renderPublicHome();
      }
      async function pullRemote() {
        // follows ?t=… or the most recently updated tournament
        if (!PUB.tid || (!qs.get("t") && !PUB.pinned)) {
          const r = await api("state").catch(() => null);
          if (r && r.ok) {
            INDEX = r.j;
            if (!PUB.pinned) PUB.tid = qs.get("t") || INDEX.latest;
          }
        }
        if (!PUB.tid) return false;
        const s = await api("state?t=" + PUB.tid).catch(() => null);
        if (s && s.ok && s.j.updated !== PUB.updated) {
          PUB.updated = s.j.updated;
          T = s.j.data.T;
          return true;
        }
        return false;
      }
      function pullLocal() {
        const raw = lget(LKEY);
        if (raw === PUB.updated) return false;
        PUB.updated = raw;
        try {
          T = raw ? JSON.parse(raw).T : null;
        } catch (e) {
          T = null;
        }
        return true;
      }
      async function pubTick() {
        if (cloud === "on") {
          if (await pullRemote()) render();
        } else if (pullLocal()) render();
      }
      function pubBoot() {
        mode = "public";
        PUB.updated = -1;
        PUB.tid = qs.get("t") || null;
        PUB.pinned = !!qs.get("t");
        T = null;
        $("#app").innerHTML = '<p class="note">Loading scores…</p>';
        pubTick().then(() => {
          if (!T) render();
        });
        PUB.timer = setInterval(pubTick, cloud === "on" ? 4000 : 1200);
      }

      /* ================= big screen ================= */
      function tvRender() {
        document.body.className = "tv";
        const app = $("#app");
        app.className = "wrap";
        const back =
          cloud === "on"
            ? ""
            : `<button class="tvback" id="tvb">Back to scoring</button>`;
        if (!T) {
          app.innerHTML = `<div class="tvbox" style="margin:auto;text-align:center"><div class="tvbig">Waiting for scores</div><p class="tvaw"><span>Scores show here as soon as the organiser starts scoring.</span></p></div>${back}`;
          bindTvBack();
          return;
        }
        const st = standings(),
          tour = collect(T.matches);
        const m =
          T.cur != null && T.matches[T.cur]
            ? T.matches[T.cur]
            : T.matches.find((x) => !x.result) ||
              T.matches[T.matches.length - 1];
        const head = `<div class="tvhead"><span><b>${esc(T.name)}</b>${m ? ` · Match ${T.matches.indexOf(m) + 1} · ${esc(tn(m.t[0]))} v ${esc(tn(m.t[1]))}` : ""}</span><span>${m ? m.overs + " overs" : ""}</span></div>`;
        const table = `<div class="tvbox"><span class="tvlbl">Points table</span><table class="tvtable"><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th><th>NRR</th></tr>
    ${st.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td><b>${r.pts}</b></td><td>${nrrTxt(r)}</td></tr>`).join("")}</table></div>`;
        const aw = (s, tour, champ) => {
          const a = s.B[0],
            w = s.W[0];
          return `<div class="tvgrid">
    ${champ ? `<div class="tvbox tvaw"><span class="tvlbl">Champions</span><b>${esc(tn(champ.i))}</b><span>${champ.pts} points</span></div>` : ""}
    ${a ? `<div class="tvbox tvaw"><span class="tvlbl">${tour ? "Top run scorer" : "Top scorer"}</span><b>${esc(a.name)}</b><span>${esc(tn(a.team))} · ${batLine(a, tour)}</span></div>` : ""}
    ${w ? `<div class="tvbox tvaw"><span class="tvlbl">Best bowler</span><b>${esc(w.name)}</b><span>${esc(tn(w.team))} · ${bowlLine(w, tour)}</span></div>` : ""}</div>`;
        };
        let body = "";
        if (T.finished)
          body = `<div class="tvbig">${esc(T.name)} winners</div>${aw(tour, true, st[0])}${table}`;
        else if (!m) body = table;
        else if (m.result) {
          const a = m.innings[0],
            b = m.innings[1];
          body = `<div class="tvbox"><span class="tvlbl">Result</span><div class="tvbig">${esc(m.result)}</div>
      <div class="tvsub"><span><b>${esc(tn(a.bat))}</b> ${a.runs}/${a.wkts} (${ov(a.balls)})</span><span><b>${esc(tn(b.bat))}</b> ${b.runs}/${b.wkts} (${ov(b.balls)})</span></div></div>
      ${aw(collect([m]), false)}${table}`;
        } else {
          const I = m.innings[m.cur];
          if (I.ended && m.cur === 0) {
            body = `<div class="tvbox"><span class="tvlbl">Innings break</span><div class="tvbig">${esc(tn(I.bowl))} need ${target(m)}</div>
        <div class="tvsub"><span><b>${esc(tn(I.bat))}</b> ${I.runs}/${I.wkts} (${ov(I.balls)})</span><span>${m.overs} overs to chase</span></div></div>
        ${aw(collect([{ innings: [I] }]), false)}`;
          } else {
            const crr = I.balls ? ((I.runs * 6) / I.balls).toFixed(2) : "0.00";
            const eq =
              m.cur === 1
                ? (() => {
                    const need = target(m) - I.runs,
                      left = m.overs * 6 - I.balls;
                    return `<div class="tveq">Need ${need} off ${left} ball${s1(left)} · RRR ${left ? ((need * 6) / left).toFixed(2) : "–"}</div>`;
                  })()
                : "";
            const brow = (k) => {
              const b = I.batters[k];
              return b
                ? `<div class="tvrow"><span class="n ${k === I.striker ? "on" : ""}">${esc(b.name)}</span><span class="r">${b.r}</span><span class="b">(${b.b})</span></div>`
                : "";
            };
            const bw = I.bowlers[I.bowler],
              cur = I.overs[I.overs.length - 1];
            const lastBall =
              cur && cur.balls.length ? cur.balls[cur.balls.length - 1] : null;
            const lastOut = [...I.batters].reverse().find((b) => b.out);
            body = `<div class="tvmain">
        <div class="tvbox"><span class="tvteam">${esc(tn(I.bat))}</span>
          <div class="tvruns"><span>${I.runs}</span><span>/${I.wkts}</span></div>
          <div class="tvsub"><span>Overs <b>${ov(I.balls)}</b> of ${m.overs}</span><span>Run rate <b>${crr}</b></span>${m.cur === 1 ? `<span>Target <b>${target(m)}</b></span>` : ""}</div>
          ${eq}</div>
        <div class="tvbox"><span class="tvlbl">Batting${I.non === -1 && I.batters.length ? " · last man alone" : ""}</span>${brow(I.striker)}${brow(I.non)}
          ${bw ? `<span class="tvlbl" style="margin-top:1.5vmin">Bowling</span><div class="tvrow"><span class="n">${esc(bw.name)}</span><span class="r">${bw.w}-${bw.r}</span><span class="b">(${ov(bw.balls)})</span></div>` : ""}
        </div></div>
      <div class="tvbox"><span class="tvlbl">This over${lastBall && lastBall.bat ? " · " + ballText(lastBall).replace(/<[^>]+>/g, "") : ""}</span><div class="tvover">${cur && cur.balls.length ? chips(cur) : '<span class="tvsub">New over</span>'}</div></div>
      <div class="tvfoot"><span>${m.cur === 1 ? `${esc(tn(m.innings[0].bat))} ${m.innings[0].runs}/${m.innings[0].wkts} (${ov(m.innings[0].balls)})` : `${maxW(m, I) - I.wkts} wicket${s1(maxW(m, I) - I.wkts)} in hand`}</span>
        <span>${lastOut ? `Last out: ${esc(lastOut.name)} ${lastOut.r} · ${esc(howText(lastOut))}` : ""}</span></div>`;
          }
        }
        app.innerHTML = head + body + back;
        bindTvBack();
      }
      function bindTvBack() {
        const b = $("#tvb");
        if (b)
          b.onclick = () => {
            location.hash = "admin";
          };
      }
      function startTV() {
        mode = "tv";
        PUB.updated = -1;
        PUB.tid = qs.get("t") || null;
        PUB.pinned = !!qs.get("t");
        T = null;
        tvRender();
        pubTick();
        PUB.timer = setInterval(pubTick, cloud === "on" ? 3000 : 1000);
        const lock = () => {
          try {
            navigator.wakeLock &&
              navigator.wakeLock.request("screen").catch(() => {});
          } catch (e) {}
        };
        lock();
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && mode === "tv") lock();
        });
      }

      /* ================= routing ================= */
      function route() {
        const h = location.hash.slice(1),
          p = location.pathname.replace(/\/+$/, "");
        if (h === "admin") return "admin";
        if (h === "tv" || h === "display" || qs.get("view") === "display")
          return "tv";
        if (h === "live" || /^match-\d+$/.test(h)) return "public";
        if (p.endsWith("/admin")) return "admin";
        if (p.endsWith("/tv")) return "tv";
        return cloud === "on" ? "public" : "admin";
      }
      function render() {
        if (mode === "admin") return renderAdmin();
        if (mode === "tv") return tvRender();
        return renderPublic();
      }
      function boot() {
        clearInterval(PUB.timer);
        sheet = null;
        $("#sheet").innerHTML = "";
        const r = route();
        if (r === "admin") return adminBoot();
        if (r === "tv") return startTV();
        return pubBoot();
      }
      window.addEventListener("hashchange", () => {
        PUB.inn = null;
        const r = route();
        if (r !== mode) boot();
        else if (mode === "public") {
          scrollTo(0, 0);
          renderPublic();
        }
      });
      window.addEventListener("storage", (e) => {
        if (e.key === LKEY && mode !== "admin" && cloud !== "on") pubTick();
      });
      window.addEventListener("online", () => {
        if (mode === "admin") schedulePush(0);
      });
      try {
        navigator.storage &&
          navigator.storage.persist &&
          navigator.storage.persist().catch(() => {});
      } catch (e) {}
      (async () => {
        $("#app").innerHTML = '<p class="note">Loading…</p>';
        await detect();
        boot();
      })();
    </script>
  </body>
</html>
